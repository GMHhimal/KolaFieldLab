# XcodeGen spec — fallback for regenerating KolaCare.xcodeproj (`xcodegen` in this folder).
name: KolaCare
options:
  bundleIdPrefix: lk.sliit.it23152632
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  KolaCare:
    type: application
    platform: iOS
    sources: [KolaCare]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.sliit.it23152632.KolaCare
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: KolaCare
        INFOPLIST_KEY_NSCameraUsageDescription: KolaCare uses the camera to photograph leaves so it can diagnose plant diseases on your device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: KolaCare uses your location to tag plots on the field map and to fetch local weather for disease alerts.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  KolaCareTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KolaCareTests]
    dependencies:
      - target: KolaCare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KolaCareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KolaCareUITests]
    dependencies:
      - target: KolaCare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KolaCare
schemes:
  KolaCare:
    build:
      targets:
        KolaCare: all
    test:
      gatherCoverageData: true
      targets: [KolaCareTests, KolaCareUITests]
